<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מצגת טיעונים</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="index-bg">
        <div class="container">
            <header class="index-header">
                <h1><i class="fas fa-balance-scale" style="color: var(--accent); margin-left: 12px;"></i>מצגת טיעונים</h1>
                <p>בחר תיק לצפייה במסמכי הטיעון</p>
                <div class="accent-line"></div>
                <button class="btn-add-case" id="addCaseBtn" title="הוסף תיק חדש">
                    <i class="fas fa-plus"></i> הוסף תיק
                </button>
            </header>

            <div id="cases-container" class="row g-4 pb-5">
            </div>

            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-info" role="status" style="color: var(--accent) !important;">
                    <span class="visually-hidden">טוען...</span>
                </div>
            </div>

            <div id="error" class="text-center py-5" style="display: none;">
                <i class="fas fa-exclamation-triangle fa-3x mb-3" style="color: var(--text-muted);"></i>
                <p style="color: var(--text-muted);">לא נמצאו תיקים. לחץ על "הוסף תיק" כדי להתחיל.</p>
            </div>

            <footer class="index-footer">
                <a href="api-docs.html"><i class="fas fa-book"></i> תיעוד API</a>
            </footer>
        </div>
    </div>

    <!-- Case Modal -->
    <div class="modal-overlay" id="caseModal">
        <div class="modal-box">
            <div class="modal-header">
                <h4 id="caseModalTitle">הוסף תיק חדש</h4>
                <button class="close-btn" id="caseModalClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="caseEditId">
                <div class="form-group">
                    <label>מזהה (באנגלית, ללא רווחים)</label>
                    <input type="text" id="caseIdInput" placeholder="my-case" dir="ltr">
                </div>
                <div class="form-group">
                    <label>שם התיק</label>
                    <input type="text" id="caseTitleInput" placeholder="שם הלקוח / התיק">
                </div>
                <div class="form-group">
                    <label>כותרת משנה (מספר תיק)</label>
                    <input type="text" id="caseSubtitleInput" placeholder='פל"א 123/2024' dir="ltr">
                </div>
                <div class="form-group">
                    <label>אייקון</label>
                    <select id="caseIconSelect">
                        <option value="fa-gavel">פטיש (ברירת מחדל)</option>
                        <option value="fa-balance-scale">מאזניים</option>
                        <option value="fa-briefcase">תיק</option>
                        <option value="fa-shield-alt">מגן</option>
                        <option value="fa-file-contract">חוזה</option>
                        <option value="fa-landmark">בניין משפט</option>
                        <option value="fa-user-shield">הגנה</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="caseModalCancel">ביטול</button>
                <button class="btn-save" id="caseModalSave"><i class="fas fa-check"></i> שמור</button>
            </div>
        </div>
    </div>

    <!-- Document Modal -->
    <div class="modal-overlay" id="docModal">
        <div class="modal-box">
            <div class="modal-header">
                <h4>הוסף מסמך חדש</h4>
                <button class="close-btn" id="docModalClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="docCaseId">
                <div class="form-group">
                    <label>מזהה (באנגלית, ללא רווחים)</label>
                    <input type="text" id="docIdInput" placeholder="hearing-arguments" dir="ltr">
                </div>
                <div class="form-group">
                    <label>כותרת המסמך</label>
                    <input type="text" id="docTitleInput" placeholder="בקשה להימנע מהגשת כתב אישום">
                </div>
                <div class="form-group">
                    <label>תאריך</label>
                    <input type="text" id="docDateInput" placeholder="2025" dir="ltr">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="docModalCancel">ביטול</button>
                <button class="btn-save" id="docModalSave"><i class="fas fa-check"></i> שמור</button>
            </div>
        </div>
    </div>

    <script src="js/app.js?v=2"></script>
</body>
</html>
