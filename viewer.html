<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מצגת טיעונים</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Reading Progress Bar -->
    <div class="reading-progress" id="readingProgress"></div>

    <!-- Navbar -->
    <nav class="viewer-navbar">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-right"></i>
            <span>חזרה</span>
        </a>
        <div class="doc-title" id="docTitle">טוען מסמך...</div>
        <div class="nav-actions">
            <button id="editModeToggle" title="מצב עריכה">
                <i class="fas fa-pen"></i>
            </button>
            <button class="sidebar-toggle" id="sidebarToggle" title="תוכן עניינים">
                <i class="fas fa-list"></i>
            </button>
            <button id="themeToggle" title="החלף ערכת נושא">
                <i class="fas fa-sun"></i>
            </button>
            <button id="printBtn" title="הדפסה">
                <i class="fas fa-print"></i>
            </button>
        </div>
    </nav>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Layout -->
    <div class="viewer-layout">
        <!-- Content Area -->
        <main class="viewer-content" id="contentArea">
            <div id="editModeBanner" class="edit-mode-banner" style="display:none;">
                <i class="fas fa-pen"></i> מצב עריכה — לחץ על הטקסט כדי לערוך
            </div>
            <div id="chapterContent">
            </div>

            <!-- Chapter Navigation -->
            <div class="chapter-nav" id="chapterNav">
                <button class="chapter-nav-btn" id="nextChapterBtn">
                    <i class="fas fa-arrow-right"></i>
                    <div>
                        <span class="nav-label">הפרק הבא</span>
                        <span class="nav-title" id="nextChapterTitle"></span>
                    </div>
                </button>
                <button class="chapter-nav-btn" id="prevChapterBtn">
                    <div>
                        <span class="nav-label">הפרק הקודם</span>
                        <span class="nav-title" id="prevChapterTitle"></span>
                    </div>
                    <i class="fas fa-arrow-left"></i>
                </button>
            </div>
        </main>

        <!-- Sidebar (TOC) -->
        <aside class="viewer-sidebar" id="sidebar">
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" data-tab="toc"><i class="fas fa-bookmark"></i> תוכן עניינים</button>
                <button class="sidebar-tab" data-tab="entities"><i class="fas fa-tags"></i> ישויות</button>
            </div>
            <div class="sidebar-tab-content" id="tocTab">
                <ul class="toc-list" id="tocList">
                </ul>
                <button class="btn-add-chapter" id="addChapterBtn" style="display:none;">
                    <i class="fas fa-plus"></i> הוסף פרק
                </button>
            </div>
            <div class="sidebar-tab-content" id="entitiesTab" style="display:none;">
                <div id="entitiesList"></div>
            </div>
        </aside>
    </div>

    <!-- PDF Modal -->
    <div class="pdf-modal-overlay" id="pdfModal">
        <div class="pdf-modal">
            <div class="pdf-modal-header">
                <h4 id="pdfModalTitle">מסמך</h4>
                <button class="close-btn" id="pdfModalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="pdf-modal-body" id="pdfModalBody">
                <div class="pdf-placeholder">
                    <i class="fas fa-file-pdf"></i>
                    <p>המסמך אינו זמין כעת</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Chapter Modal -->
    <div class="modal-overlay" id="chapterModal">
        <div class="modal-box modal-wide">
            <div class="modal-header">
                <h4 id="chapterModalTitle">הוסף פרק חדש</h4>
                <button class="close-btn" id="chapterModalClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="chapterEditId">
                <div class="form-group">
                    <label>מזהה (באנגלית, ללא רווחים)</label>
                    <input type="text" id="chapterIdInput" placeholder="chapter-intro" dir="ltr">
                </div>
                <div class="form-group">
                    <label>כותרת הפרק</label>
                    <input type="text" id="chapterTitleInput" placeholder="מבוא">
                </div>
                <div class="form-group">
                    <label>אייקון</label>
                    <select id="chapterIconSelect">
                        <option value="fa-bookmark">סימניה</option>
                        <option value="fa-book">ספר</option>
                        <option value="fa-gavel">פטיש</option>
                        <option value="fa-balance-scale">מאזניים</option>
                        <option value="fa-search">חיפוש</option>
                        <option value="fa-user">אדם</option>
                        <option value="fa-building">בניין</option>
                        <option value="fa-file-alt">מסמך</option>
                        <option value="fa-shield-alt">מגן</option>
                        <option value="fa-exclamation-triangle">אזהרה</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>תוכן (HTML)</label>
                    <textarea id="chapterContentInput" rows="12" placeholder="<p>תוכן הפרק כאן...</p>"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="chapterModalCancel">ביטול</button>
                <button class="btn-save" id="chapterModalSave"><i class="fas fa-check"></i> שמור</button>
            </div>
        </div>
    </div>

    <!-- Keyboard Shortcuts Hint -->
    <div class="kbd-hint" id="kbdHint">
        <kbd>&rarr;</kbd> פרק קודם &nbsp; <kbd>&larr;</kbd> פרק הבא &nbsp; <kbd>Esc</kbd> סגור
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/entities.js?v=3"></script>
    <script src="js/viewer.js?v=3"></script>
</body>
</html>
